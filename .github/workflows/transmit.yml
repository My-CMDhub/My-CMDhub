name: Transmit
on:
  # Hourly, at :17 rather than :00 — GitHub queues the top of the hour and runs those late (the daily
  # run was landing ~2 h after its slot). A run only commits when the cards actually changed.
  # The site also starts this run after every deploy (site.yml, PROFILE_TOKEN), so a change there
  # shows here within minutes. Commits elsewhere show on the next hourly run.
  schedule: [{ cron: '17 * * * *' }]
  workflow_dispatch:
  push:
    paths: ['transmit.py', 'README.md']
permissions:
  contents: write
concurrency: transmit   # one run at a time, so two never race to push
jobs:
  transmit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 transmit.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -m 'transmit: refresh signal' && git push
