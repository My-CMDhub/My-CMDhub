name: Recent commits
on:
  schedule: [{ cron: '0 20 * * *' }]   # 06:00 Melbourne (AEST)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          SKIP: 'My-CMDhub cicd typescript-backend Agent CommBank-Server CommBank-Web'
        run: |
          list=$(gh repo list My-CMDhub --visibility public --no-archived --limit 100 --json name,url,pushedAt \
            -q 'sort_by(.pushedAt) | reverse | .[] | "\(.name)\t\(.url)\t\(.pushedAt[:10])"' |
            while IFS=$'\t' read -r n u d; do
              case " $SKIP " in *" $n "*) continue;; esac
              msg=$(gh api "repos/My-CMDhub/$n/commits?per_page=10" \
                -q '[.[].commit.message | split("\n")[0] | select(startswith("Merge") | not)][0] // ""' | cut -c1-80)
              echo "- [$n]($u) · $d · $msg"
            done | head -5)
          L="$list" awk '/<!--recent:start-->/{print; print ENVIRON["L"]; skip=1; next} /<!--recent:end-->/{skip=0} !skip' README.md > R.md
          mv R.md README.md
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Update recent commits' && git push
